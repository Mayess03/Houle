
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  namespace: houle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      containers:
        - name: simulator
          image: mayess03/houle-simulator:0.1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: API_URL
              value: "http://backend:8000"
            - name: INTERVAL_SECONDS
              value: "5"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
