services:

  postgres:
    image: postgres:16-alpine
    container_name: houle-postgres
    environment:
      POSTGRES_USER: houle
      POSTGRES_PASSWORD: houle_dev_password
      POSTGRES_DB: houle
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U houle -d houle"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: houle-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  simulator:
    build: ./simulator
    container_name: houle-simulator
    environment:
      API_URL: http://backend:8000
      INTERVAL_SECONDS: 5
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: